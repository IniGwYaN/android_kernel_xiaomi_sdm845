name: Build beryllium kernel (LineageOS lineage-20)

on:
  push:
    branches: [lineage-20]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sdm845
          ref: lineage-20
          path: kernel

      - name: Install toolchain (GCC + binutils)
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64

      - name: Configure kernel (base mi845 + beryllium fragment)
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- DTC_FLAGS="-f" vendor/xiaomi/mi845_defconfig
          ./scripts/kconfig/merge_config.sh -m -O ./out arch/arm64/configs/vendor/xiaomi/mi845_defconfig arch/arm64/configs/vendor/xiaomi/beryllium.config

      - name: Build kernel
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- DTC_FLAGS="-f" -j"$(nproc)" Image.gz-dtb

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: beryllium-lineage20-stock
          path: kernel/out/arch/arm64/boot/Image.gz-dtb

