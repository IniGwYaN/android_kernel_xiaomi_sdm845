name: Build beryllium kernel (REPRO v0.5.5: fork@a7809bd68e + gcc9/20.04)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: IniGwYaN/android_kernel_xiaomi_sdm845
          ref: a7809bd68e
          path: kernel

      - name: Install toolchain (Ubuntu 20.04 -> gcc 9.4.0)
        run: |
          apt-get update
          apt-get install -y git patch crossbuild-essential-arm64 crossbuild-essential-armhf

      - name: Integrate BakaSU main
        working-directory: kernel
        run: |
          git clone --depth 1 -b main https://github.com/Baka-SU/BakaSU KernelSU
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i "/endmenu/i source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig

      - name: Integrate SUSFS v2.3.0 (in-tree)
        working-directory: kernel
        run: |
          cp susfs_chimera/susfs.c fs/susfs.c
          cp susfs_chimera/susfs.h include/linux/susfs.h
          cp susfs_chimera/susfs_def.h include/linux/susfs_def.h
          patch -p1 -N < susfs_chimera/chimera_susfs_full.patch

      - name: Fix 4.9 compat (filename_lookup->user_path_at, all_var)
        working-directory: kernel
        run: |
          sed -i 's|res = filename_lookup(dfd, fname, lookup_flags, &path, NULL);|res = user_path_at(dfd, filename, lookup_flags, \&path);|g' fs/open.c fs/stat.c
          sed -i 's|error = filename_lookup(dfd, fname, lookup_flags, &path, NULL);|error = user_path_at(dfd, filename, lookup_flags, \&path);|g' fs/stat.c
          awk '/#include <linux\/filter.h>/{print; print "#ifdef CONFIG_KALLSYMS_ALL"; print "#define all_var 1"; print "#else"; print "#define all_var 0"; print "#endif"; next} {print}' kernel/kallsyms.c > tmp && mv tmp kernel/kallsyms.c

      - name: Configure kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          make O=out CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 DTC_FLAGS="-f" vendor/xiaomi/mi845_defconfig
          printf 'CONFIG_CPU_FREQ_GOV_INTERACTIVE=y\nCONFIG_MSM_PERFORMANCE=y\nCONFIG_CPU_BOOST=y\n' >> arch/arm64/configs/vendor/xiaomi/beryllium.config
          ./scripts/kconfig/merge_config.sh -m -O ./out arch/arm64/configs/vendor/xiaomi/mi845_defconfig arch/arm64/configs/vendor/xiaomi/beryllium.config
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --enable KSU_MANUAL_HOOK
          ./scripts/config --file out/.config --enable KSU_SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --disable KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --disable KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file out/.config --enable KSU_SUSFS_ENABLE_LOG
          ./scripts/config --file out/.config --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ./scripts/config --file out/.config --enable KSU_SUSFS_OPEN_REDIRECT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_MAP
          ./scripts/config --file out/.config --disable KSU_SUSFS_AUTO_MOUNT_SOURCE_SPOOF
          make O=out CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 DTC_FLAGS="-f" olddefconfig
          grep -E "KSU_SUSFS" out/.config || true

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          make O=out CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 DTC_FLAGS="-f" KCFLAGS="-Wno-error" -j"$(nproc)" Image.gz-dtb

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: beryllium-repro-v055-gcc9
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
