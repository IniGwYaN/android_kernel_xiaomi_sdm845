name: Build beryllium kernel (LineageOS lineage-20 + BakaSU + SUSFS v2.3.0)

on:
  push:
    branches: [lineage-20]
  workflow_dispatch:
    inputs:
      susfs:
        description: Include SUSFS
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sdm845
          ref: lineage-20
          path: kernel

      - uses: actions/checkout@v4
        with:
          repository: IniGwYaN/android_kernel_xiaomi_sdm845
          ref: lineage-20
          path: susfs_src

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64 crossbuild-essential-armhf git patch

      - name: Integrate BakaSU v4.2.0-rc3
        working-directory: kernel
        run: |
          git clone --depth 1 -b v4.2.0-rc3 https://github.com/Baka-SU/BakaSU KernelSU
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo "obj-$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i "/endmenu/i source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig

      - name: Integrate Chimera SUSFS v2.3.0 kernel-side
        working-directory: kernel
        run: |
          cp ../susfs_src/susfs_chimera/susfs.c fs/susfs.c
          cp ../susfs_src/susfs_chimera/susfs.h include/linux/susfs.h
          cp ../susfs_src/susfs_chimera/susfs_def.h include/linux/susfs_def.h
          patch -p1 -N < ../susfs_src/susfs_chimera/chimera_susfs_full.patch

      - name: Configure kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          make O=out CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 DTC_FLAGS="-f" vendor/xiaomi/mi845_defconfig
          printf 'CONFIG_CPU_FREQ_GOV_INTERACTIVE=y\nCONFIG_MSM_PERFORMANCE=y\nCONFIG_CPU_BOOST=y\n' >> arch/arm64/configs/vendor/xiaomi/beryllium.config
          ./scripts/kconfig/merge_config.sh -m -O ./out arch/arm64/configs/vendor/xiaomi/mi845_defconfig arch/arm64/configs/vendor/xiaomi/beryllium.config
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --enable KSU_MANUAL_HOOK
          if [ "${{ inputs.susfs }}" = yes ]; then
            ./scripts/config --file out/.config --enable KSU_SUSFS
            ./scripts/config --file out/.config --enable KSU_SUSFS_AUTO_MOUNT_SOURCE_SPOOF
          fi
          make O=out CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 DTC_FLAGS="-f" olddefconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          make O=out CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 DTC_FLAGS="-f" KCFLAGS="-Wno-error" -j"$(nproc)" Image.gz-dtb

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: beryllium-lineage20-bakasu-chimera-susfs
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
