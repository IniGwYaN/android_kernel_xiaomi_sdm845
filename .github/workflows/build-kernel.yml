name: Build beryllium kernel (LineageOS lineage-20)

on:
  push:
    branches: [lineage-20]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sdm845
          ref: lineage-20
          path: kernel

      - name: Install toolchain (Clang 14 + binutils)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 lld-14 llvm-14 crossbuild-essential-arm64

      - name: Build kernel (stock lineage-20)
        working-directory: kernel
        run: |
          export PATH=/usr/lib/llvm-14/bin:$PATH
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- sdm845_defconfig
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image.gz-dtb

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: beryllium-lineage20-stock
          path: kernel/out/arch/arm64/boot/Image.gz-dtb

