name: Build beryllium kernel (LineageOS lineage-20 + BakaSU + SUSFS)

on:
  push:
    branches: [lineage-20]
  workflow_dispatch:
    inputs:
      susfs:
        description: Include SUSFS v2
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      mode:
        description: SUSFS feature profile
        required: true
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'min'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sdm845
          ref: lineage-20
          path: kernel

      - name: Install toolchain (GCC arm64 + armhf)
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64 crossbuild-essential-armhf git

      - name: Integrate BakaSU v4.2.0-rc3 (KernelSU)
        working-directory: kernel
        run: |
          git clone --depth 1 -b v4.2.0-rc3 https://github.com/Baka-SU/BakaSU KernelSU
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig

      - name: Integrate SUSFS master (2.x) kernel-side
        if: inputs.susfs == 'yes'
        working-directory: kernel
        run: |
          git clone --depth 1 https://gitlab.com/simonpunk/susfs4ksu susfs
          cp susfs/kernel_patches/fs/susfs.c fs/
          cp susfs/kernel_patches/include/linux/susfs.h include/linux/
          python3 -c "add='\nint path_umount(struct path *path, int flags)\n{\n\tstruct mount *mnt = real_mount(path->mnt);\n\tint ret;\n\tmntget(&mnt->mnt);\n\tlock_mount_hash();\n\tret = do_umount(mnt, flags);\n\tunlock_mount_hash();\n\tmntput(&mnt->mnt);\n\treturn ret;\n}\n'; s=open('fs/namespace.c').read(); open('fs/namespace.c','w').write(s+add) if 'int path_umount' not in s else None; print('ok')"
          patch -p1 -N < susfs/kernel_patches/50_add_susfs_in_kernel-4.9.patch || true

      - name: Configure kernel (base mi845 + beryllium + KSU/SUSFS)
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          make O=out CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 DTC_FLAGS="-f" vendor/xiaomi/mi845_defconfig
          printf "\nCONFIG_CPU_FREQ_GOV_INTERACTIVE=y\nCONFIG_MSM_PERFORMANCE=y\nCONFIG_CPU_BOOST=y\n" >> arch/arm64/configs/vendor/xiaomi/beryllium.config
          ./scripts/kconfig/merge_config.sh -m -O ./out arch/arm64/configs/vendor/xiaomi/mi845_defconfig arch/arm64/configs/vendor/xiaomi/beryllium.config
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --enable KSU_MANUAL_HOOK
          [ "${{ inputs.susfs }}" = yes ] && ./scripts/config --file out/.config --enable KSU_SUSFS || true
          if [ "${{ inputs.mode }}" = min ]; then
            ./scripts/config --file out/.config --disable KSU_SUSFS_SPOOF_UNAME
            ./scripts/config --file out/.config --disable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            ./scripts/config --file out/.config --disable KSU_SUSFS_OPEN_REDIRECT
            ./scripts/config --file out/.config --disable KSU_SUSFS_SUS_PATH
            ./scripts/config --file out/.config --disable KSU_SUSFS_ENABLE_LOG
          fi
          make O=out CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 DTC_FLAGS="-f" olddefconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          make O=out CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 DTC_FLAGS="-f" KCFLAGS="-Wno-error" -j"$(nproc)" Image.gz-dtb

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: beryllium-lineage20-bakasu-susfs-master
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
